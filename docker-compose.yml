services:

  pfms-db:
    image: postgres:18
    environment:
      POSTGRES_DB: personal_finance_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d personal_finance_management_system" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7
    container_name: pfms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  pfms-backend:
    build: .
    depends_on:
      pfms-db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pfms-db:5432/personal_finance_management_system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_PASSWORD: ${USER_PASSWORD}

      AWS_SNS_ACCESS_KEY: ${AWS_SNS_ACCESS_KEY}
      AWS_SNS_SECRET_KEY: ${AWS_SNS_SECRET_KEY}
#      AWS_SNS_REGION: ${AWS_SNS_REGION}
#      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN}

volumes:
  postgres_data:
  redis-data:
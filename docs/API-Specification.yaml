components:
  schemas:
    WalletRequest:
      type: object
      properties:
        name:
          type: string
        balance:
          type: number
          minimum: 0
        currency:
          type: string
      required:
        - currency
        - name
    ApiResponseUUID:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RestDataUUID"
        timestamp:
          type: string
          format: date-time
    RestDataUUID:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: string
          format: uuid
        details:
          type: object
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 120
          minLength: 0
        phoneNumber:
          type: string
          pattern: "^(0?)(3[2-9]|5[6|8|9]|7[0|6-9]|8[0-6|8|9]|9[0-4|6-9])[0-9]{7}.{0,15}$"
        dateOfBirth:
          type: string
          format: date
    ApiResponseUserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RestDataUserProfileResponse"
        timestamp:
          type: string
          format: date-time
    RestDataUserProfileResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserProfileResponse"
        details:
          type: object
    UserProfileResponse:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        avatar:
          type: string
    GoalRequest:
      type: object
      properties:
        name:
          type: string
        targetAmount:
          type: number
          minimum: 0.01
        targetDate:
          type: string
          format: date
      required:
        - name
        - targetAmount
        - targetDate
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RestDataVoid"
        timestamp:
          type: string
          format: date-time
    RestDataVoid:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
        details:
          type: object
    CategoryRequest:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
      required:
        - name
        - type
    BudgetRequest:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        amount:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - amount
        - categoryId
        - endDate
        - name
        - startDate
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          pattern: "^(?=.*[0-9])(?=.*[!@#$%^&*(){}_+=~`|:;'<>,./?])(?=.*[a-z])(?=.*[A-Z]).{6,120}$"
        confirmPassword:
          type: string
      required:
        - confirmPassword
        - newPassword
        - oldPassword
    TransactionRequest:
      type: object
      properties:
        purpose:
          type: string
        amount:
          type: number
        type:
          type: string
          enum:
            - EXPENSE
            - INCOME
        description:
          type: string
        transactionDate:
          type: string
          format: date
        walletId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
      required:
        - amount
        - categoryId
        - purpose
        - transactionDate
        - type
        - walletId
    VerifyOtpRequest:
      type: object
      properties:
        identity:
          type: string
        otp:
          type: string
          pattern: "\\d{6}"
      required:
        - identity
        - otp
    ApiResponseVerifyOtpResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RestDataVerifyOtpResponse"
        timestamp:
          type: string
          format: date-time
    RestDataVerifyOtpResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/VerifyOtpResponse"
        details:
          type: object
    VerifyOtpResponse:
      type: object
      properties:
        email:
          type: string
    ResetPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
        newPassword:
          type: string
          pattern: "^(?=.*[0-9])(?=.*[!@#$%^&*(){}_+=~`|:;'<>,./?])(?=.*[a-z])(?=.*[A-Z]).{6,120}$"
        confirmPassword:
          type: string
      required:
        - confirmPassword
        - identifier
        - newPassword
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 120
          minLength: 0
        password:
          type: string
          pattern: "^(?=.*[0-9])(?=.*[!@#$%^&*(){}_+=~`|:;'<>,./?])(?=.*[a-z])(?=.*[A-Z]).{6,120}$"
        confirmPassword:
          type: string
      required:
        - confirmPassword
        - email
        - password
    ApiResponseRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RestDataRegisterResponse"
        timestamp:
          type: string
          format: date-time
    RegisterResponse:
      type: object
      properties:
        email:
          type: string
          description: Địa chỉ email đã đăng ký tài khoản
    RestDataRegisterResponse:

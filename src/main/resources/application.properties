spring.application.name=PersonalFinanceManagementSystem
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/personal_finance_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.security.user.name=DieuHoang
spring.security.user.password=Ht@dieu2006

security.public-endpoints = /api/v1/auth/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
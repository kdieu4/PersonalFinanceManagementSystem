spring.application.name=PersonalFinanceManagementSystem
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/personal_finance_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=validate

spring.security.user.name=DieuHoang
spring.security.user.password=Ht@dieu2006

security.public-endpoints=/api/v1/auth/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.mail.username=hoangdieu100506@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

